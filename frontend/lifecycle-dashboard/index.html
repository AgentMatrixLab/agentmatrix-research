<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>因子生命周期监控面板</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">Life</span>
    <div>
      <h1>因子生命周期监控面板</h1>
      <p class="sub" id="sub-title">从出生到死亡 · 全流程闸门 · 证据链 · OOS 封存</p>
    </div>
  </div>
  <nav class="topnav">
    <a href="/factor-db/">因子库目录</a>
    <a href="http://127.0.0.1:8012/factor-trust/" target="_blank">因子信任分级</a>
    <a href="http://127.0.0.1:8012/zoo-dashboard/" target="_blank">Mock 验证面板</a>
    <a href="#" id="reload-btn">刷新</a>
  </nav>
</header>

<main id="main">

  <!-- 1. 生命周期流水线 -->
  <section class="panel">
    <div class="panel-head">
      <h2>生命周期流水线</h2>
      <span class="hint" id="pipeline-hint"></span>
    </div>
    <div class="pipeline" id="pipeline"></div>
  </section>

  <!-- 2. 九道闸门漏斗 + OOS 封存 -->
  <div class="two-col">
    <section class="panel">
      <div class="panel-head">
        <h2>九道验真闸门 · 死亡漏斗</h2>
        <span class="hint" id="funnel-hint"></span>
      </div>
      <div class="funnel" id="gate-funnel"></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h2>OOS 封存监控</h2>
        <span class="hint">每因子上限 <b id="oos-max"></b> 次 · 超限自动 rejected</span>
      </div>
      <div class="oos-list" id="oos-list"></div>
    </section>
  </div>

  <!-- 3. 因子总表 -->
  <section class="panel">
    <div class="panel-head">
      <h2>因子总表</h2>
      <div class="controls">
        <select id="state-select"></select>
        <input type="text" id="factor-search" placeholder="搜索因子名…">
      </div>
    </div>
    <div class="table-wrap">
      <table id="factor-table">
        <thead>
          <tr>
            <th>因子</th>
            <th>状态</th>
            <th>闸门</th>
            <th>死因</th>
            <th>OOS 剩余</th>
          </tr>
        </thead>
        <tbody id="factor-tbody"></tbody>
      </table>
    </div>
    <p class="hint" id="factor-count"></p>
  </section>

  <!-- 4. 证据链事件流 -->
  <section class="panel">
    <div class="panel-head">
      <h2>证据链账本（append-only）</h2>
      <span class="hint">无证据记录的状态变更视为非法</span>
    </div>
    <div class="evidence-feed" id="evidence-feed"></div>
  </section>
</main>

<!-- 因子详情抽屉 -->
<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <h2 id="drawer-title"></h2>
      <p class="sub" id="drawer-sub"></p>
    </div>
    <button class="close-btn" id="drawer-close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
