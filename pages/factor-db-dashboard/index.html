<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>A股因子库目录 | Factor DB</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link rel="stylesheet" href="./styles.css?v=2" />
</head>
<body>
  <!-- 登录门禁（与生命周期面板同一模式；前端门禁 + 只读展示，真实数据权限由后端控制） -->
  <div class="login-view" id="loginView">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">Σ</span>
        <h2>A股因子库目录</h2>
      </div>
      <p class="login-sub">公司内部研究面板 · 请输入访问密码</p>
      <form id="loginForm" autocomplete="off">
        <input type="password" id="loginPassword" placeholder="请输入公司访问密码" autofocus />
        <button type="submit">登录</button>
        <p class="login-error" id="loginError"></p>
      </form>
      <p class="login-hint">仅限公司内部人员访问 · 请勿外传链接或密码</p>
    </div>
  </div>

  <div class="app-shell" id="appShell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Σ</span>
      <div>
        <div class="brand-title">A股因子库目录</div>
        <div class="brand-sub">Factor DB · AgentMatrixLab</div>
      </div>
    </div>
    <div class="topbar-stats" id="topStats">加载中…</div>
  </header>

  <main class="layout">
    <!-- 左侧：检索面板 -->
    <aside class="side-panel">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="搜索因子：名称 / 定义 / 公式…" autocomplete="off" />
      </div>
      <div class="filter-group">
        <div class="filter-label">大类</div>
        <div class="chips" id="categoryChips"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">来源</div>
        <div class="chips" id="sourceChips"></div>
      </div>
      <div class="result-meta" id="resultMeta"></div>
      <div class="factor-list" id="factorList"></div>
    </aside>

    <!-- 右侧：详情面板 -->
    <section class="detail-panel" id="detailPanel">
      <div class="detail-empty" id="detailEmpty">
        <div class="empty-icon">ƒ</div>
        <p>从左侧选择一个因子，查看定义、公式、应用场景与分布</p>
      </div>
      <div class="detail-content" id="detailContent" hidden></div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="modeStatus">静态快照 · 加载中…</span>
    <span class="spacer"></span>
    <a href="#" class="footer-link" id="dictCsvLink">下载数据字典 (CSV)</a>
    <a href="#" class="footer-link" id="dictJsonLink">下载数据字典 (JSON)</a>
    <a href="#" class="footer-link" id="logoutBtn">退出登录</a>
    <a href="../" class="footer-link">返回门户</a>
  </footer>
  </div><!-- /app-shell -->

  <script src="./app.js?v=2"></script>
</body>
</html>
