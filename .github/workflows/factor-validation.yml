name: Factor Validation

on:
  pull_request:
    paths:
      - 'research_core/factor_lab/**'
      - 'research_core/data_loader/**'
      - 'research_core/strategy_engine/**'
      - 'research_core/strategy_operations/**'
      - 'research_core/backtest_jobs/**'
      - 'research_core/backtest_adapter/**'
      - 'registry/factor_registry/**'
      - 'submissions/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pages/**'
      - 'configs/validation_gates.yaml'
      - 'Makefile'
      - 'contracts/factor_research.py'
      - 'contracts/backtest.py'
  workflow_dispatch:
    inputs:
      factors:
        description: 'Factor names (for manual run on alpha101)'
        required: false
        default: ''

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas scipy pytest PyYAML Flask flask-cors pyarrow -q

      - name: Detect changed factors
        id: detect
        shell: bash
        run: |
          set -o pipefail
          git diff --name-only origin/${{ github.base_ref }}...HEAD
          python scripts/ci_detect_changes.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --output-json /tmp/changed_factors.json
          cat /tmp/changed_factors.json

      - name: "Run unit tests [Layer 1: Formula]"
        shell: bash
        run: |
          set -o pipefail
          python -m pytest research_core/factor_lab/ tests/ -v --tb=short 2>&1 | tee /tmp/unit_test_output.txt

      - name: "Verify delivery tooling runs [Layer 0: Tooling]"
        shell: bash
        run: |
          set -euo pipefail
          # The export and supplement scripts talk to a licensed data server and
          # a populated runs directory, so CI cannot exercise their full path.
          # It can still prove they import, parse arguments, and reach their
          # documented dry-run exits -- which is what a syntax-level break would
          # otherwise take down silently, since py_compile alone does not import.
          echo "--- RQData export: dry run ---"
          python -X utf8 scripts/export_rqsdk_panel.py --dry-run --out-dir /tmp/amr-export
          echo "--- RQData export: self-check on a missing directory must fail cleanly ---"
          if python -X utf8 scripts/export_rqsdk_panel.py --out-dir /tmp/amr-absent --self-check; then
            echo "self-check unexpectedly succeeded on a missing directory" >&2
            exit 1
          fi
          echo "--- Factor console dataset rebuild ---"
          python -X utf8 scripts/build_factor_panel.py
          test -s pages/factor-panel/data/panel.json
          echo "--- Supplement and rehearsal entry points parse ---"
          python -X utf8 scripts/run_robustness_supplement.py --help > /dev/null
          python -X utf8 scripts/dev/rehearse_full_pipeline.py --help > /dev/null
          python -X utf8 scripts/build_strategy_demos.py --help > /dev/null
          echo "Delivery tooling OK"

      - name: "Run submission tests [Layer 1: Formula]"
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/submission_test_output.txt
          if [ -f /tmp/changed_submissions.txt ] && [ -s /tmp/changed_submissions.txt ]; then
            status=0
            while IFS= read -r sub_dir; do
              if [ -f "$sub_dir/test_factor.py" ]; then
                echo "Testing: $sub_dir"
                if ! python -m pytest "$sub_dir/test_factor.py" -v --tb=short 2>&1 | tee -a /tmp/submission_test_output.txt; then
                  status=1
                fi
              fi
            done < /tmp/changed_submissions.txt
            exit "$status"
          else
            echo "No submission changes detected"
          fi

      - name: "Run factor_lab validation [Layer 1+2+3]"
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_factor_validate.py \
            --changed-json /tmp/changed_factors.json \
            --output-dir /tmp/validation_output \
            2>&1 | tee /tmp/validation_run.txt

      - name: Generate PR comment
        id: comment
        if: always()
        run: |
          python scripts/ci_generate_pr_comment.py \
            --unit-test-log /tmp/unit_test_output.txt \
            --submission-test-log /tmp/submission_test_output.txt \
            --validation-dir /tmp/validation_output \
            --changed-json /tmp/changed_factors.json \
            --output /tmp/pr_comment.md

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: /tmp/pr_comment.md
          comment-tag: factor-validation
          mode: recreate
          create-if-not-exists: true
