[pytest]
# Use importlib import mode so that two test files with the same basename
# (e.g. examples/.../test_factor.py and submissions/.../test_factor.py)
# don't collide during collection.
addopts = --import-mode=importlib

# Only collect from these dirs by default — root-level scattered test files
# (backend/, deerflow/, submissions/, examples/) often have side-effects
# at import time and are not part of the core test suite.
testpaths = tests research_core/qlib_lab

# Warnings configuration
filterwarnings =
    ignore::DeprecationWarning:research_core.factor_lab.runtime
    ignore::RuntimeWarning:numpy.lib._function_base_impl
